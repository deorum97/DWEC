<div class="container" id="app">
  <h2>Nueva canción – {{album?.title}}</h2>
  <form [formGroup]="songForm" (submit)="saveSong()">
    <label>Título</label><br />
    <input type="text" formControlName="title" /><br />

    <label>Duración (s)</label><br />
    <input type="number" formControlName="duration" /><br />

    <label>Rating</label><br />
    <select formControlName="rating">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option></select
    ><br /><br />

    <button type="submit">Guardar</button>
    <button [routerLink]="[`/songs/`+album?._id]">Cancelar</button>
  </form>
</div>
