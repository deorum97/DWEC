<div class="container" id="app">
  <h2>Álbumes</h2>
  <button [routerLink]="['/albums/new']">➕ Nuevo álbum</button>

  <br /><br />
  <label>Filtrar por género:</label><br />
  <input
    type="text"
    #filterGenre
    (keyup)="filterByGenre(filterGenre.value)"
    placeholder="Rock, Electronic..."
  />

  <table>
    <thead>
      <tr>
        <th>Título</th>
        <th>Artista</th>
        <th>Año</th>
        <th>Género</th>
        <th>Nº Canciones</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="albumTable">
      @for(album of albumListFiltered; track $index){
      <tr>
        <td>{{album.title}}</td>
        <td>{{album.artist}}</td>
        <td>{{album.year}}</td>
        <td>{{album.genre}}</td>
        <td></td>
        <td class="actions">
          <button [routerLink]="[`/songs`,album._id]">Ver canciones</button>
          <button (click)="deleteAlbum(album._id)">Eliminar</button>
        </td>
      </tr>
      }
    </tbody>
  </table>
</div>
