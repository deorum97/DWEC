<form [formGroup]="movieForm" (submit)="updateMovie()">
  <label
    >titulo
    <input type="text" formControlName="title" />
  </label>

  <label
    >genero
    <input type="text" formControlName="genre" />
  </label>
  <label
    >año
    <input type="number" formControlName="year" />
  </label>
  <label
    >rating
    <input type="number" formControlName="rating" min="0" max="10" />
  </label>
  <label
    >plataforma
    <input type="text" formControlName="platform" />
  </label>
  <label
    >imagen
    <input type="text" formControlName="imageUrl" />
  </label>

  <button type="submit">Apply now</button>
</form>
