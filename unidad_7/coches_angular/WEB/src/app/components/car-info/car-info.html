<div class="car-card">
  <h3>{{ carInfo().marca }} {{ carInfo().modelo }}</h3>
  <p>Año: {{ carInfo().year }}</p>
  <p>Precio: ${{ carInfo().precio }}</p>
  <img
    class="foto"
    [src]="carInfo().imagen"
    alt="{{ carInfo().marca }} {{ carInfo().modelo }}"
  />
  <div class="details-link">
    <a [routerLink]="['/car-details', carInfo().id]">Ver detalles</a>
  </div>
</div>
