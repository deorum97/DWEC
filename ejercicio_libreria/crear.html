<!DOCTYPE html>

  <head>

    <title>Crear libros</title>
    <link rel="stylesheet" href="css.css" />
    <script defer type="module" src="scripts/crear.js"></script>
  </head>
  <body>
    <header></header>
    <main>
      <section class="sectionCrear">

          <label

        </form>
      </section>
      <section>
        <button class="crear" id="botonCrear">Crear</button>
      </section>
    </main>
