<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script defer type="module" src="js/gameControler.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <form id="formGlobos" class="flip-card">
        <label for="numero de globos">
          <input type="number" id="numGlobos" class="flip-card__input" />
        </label>
        <button id="submitGlobos" type="button" class="flip-card__btn">
          Adelante!
        </button>
      </form>
      <section class="sectionGlobos" id="sectionGlobos"></section>

      <div style="visibility: hidden" class="flip-card" id="puntuacion">
        <p>puntos:</p>
        <p id="puntos"></p>
        <p id="fallos"></p>
        <p id="puntuacionFinal"></p>
      </div>
    </main>
  </body>
