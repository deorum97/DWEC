<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juego</title>
    <link rel="stylesheet" href="stylePalabra.css" />
    <script defer type="module" src="js/palabraControler.js"></script>
  </head>
  <body>
    <main>
      <section class="top_section">
        <aside class="aside_juego">
          <div>
            <pre>😎 Mejor resultado: </pre>
            <p id="mejor"></p>
          </div>
          <div>
            <pre>☠ Ultima Partida: </pre>
            <p id="ultima"></p>
          </div>
          <div>
            <pre>🐱‍👤 Puntuación: </pre>
            <p id="puntos"></p>
          </div>
          <div class="vidas">
            <pre>💖 Vidas: </pre>
            <p id="vidas"></p>
          </div>
          <div class="vidas">
            <pre>⭐ Nivel: </pre>
            <p id="nivel"></p>
          </div>
        </aside>
        <section class="section_juego" id="juego"></section>
      </section>
      <section class="input_palabra">
        <input
          type="text"
          id="adivinaPalabra"
          placeholder="Palabra"
          class="flip-card__input"
        />
      </section>
    </main>
    <section id="gameOver" class="gameOver">
      <p id="gameOverUltimaPuntuacion"></p>
      <p id="gameOverMejorPuntuacion"></p>
      <button class="reiniciarPartida" id="reiniciarPartida">
        Reiniciar juego
      </button>
      <button class="cambiarUsuario" id="cambiarUsuario">
        Cambiar de usuario
      </button>
    </section>
  </body>
</html>
